name: Fotos PousadasFácil (Unsplash)
on:
  push:
    paths: ['pousadasfacil/fotos/pedido.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 pousadasfacil/fotos/buscar.py
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      - run: |
          git config user.name "fotos-bot"
          git config user.email "fotos-bot@users.noreply.github.com"
          git add pousadasfacil/fotos
          git commit -m "Fotos PousadasFácil: resultado do pedido" || echo "nada novo"
          git push
